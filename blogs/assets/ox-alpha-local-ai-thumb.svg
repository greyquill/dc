<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f88"/>
      <stop offset="0.55" stop-color="#0a3c68"/>
      <stop offset="1" stop-color="#082b4c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1140" cy="110" r="300" fill="#4d9be8" opacity="0.24"/>
  <circle cx="110" cy="640" r="240" fill="#c4683c" opacity="0.20"/>

  <!-- the perimeter: a boundary the data never crosses -->
  <rect x="300" y="150" width="680" height="420" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.9"/>

  <!-- the machine inside it: one solid block of capability, amber -->
  <rect x="470" y="270" width="340" height="180" fill="#e08a58"/>
  <g fill="#0a3c68" opacity="0.55">
    <rect x="500" y="300" width="280" height="14"/>
    <rect x="500" y="334" width="280" height="14"/>
    <rect x="500" y="368" width="280" height="14"/>
    <rect x="500" y="402" width="180" height="14"/>
  </g>

  <!-- traffic that stops at the boundary -->
  <g stroke="#bcd9f4" stroke-width="7" opacity="0.6" fill="none" stroke-linecap="round">
    <line x1="120" y1="240" x2="250" y2="240"/>
    <line x1="120" y1="360" x2="250" y2="360"/>
    <line x1="120" y1="480" x2="250" y2="480"/>
  </g>
  <g fill="#bcd9f4" opacity="0.6">
    <path d="M250 222 L 282 240 L 250 258 Z"/>
    <path d="M250 342 L 282 360 L 250 378 Z"/>
    <path d="M250 462 L 282 480 L 250 498 Z"/>
  </g>
</svg>
