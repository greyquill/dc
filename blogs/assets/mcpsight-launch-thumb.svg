<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f88"/>
      <stop offset="0.55" stop-color="#0a3c68"/>
      <stop offset="1" stop-color="#082b4c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1140" cy="110" r="300" fill="#4d9be8" opacity="0.24"/>
  <circle cx="110" cy="640" r="240" fill="#c4683c" opacity="0.20"/>

  <!-- a tool description: lines of ordinary text -->
  <rect x="330" y="150" width="620" height="420" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.9"/>
  <g fill="#bcd9f4" opacity="0.55">
    <rect x="390" y="210" width="500" height="16"/>
    <rect x="390" y="250" width="440" height="16"/>
    <rect x="390" y="290" width="480" height="16"/>
    <rect x="390" y="450" width="460" height="16"/>
    <rect x="390" y="490" width="320" height="16"/>
  </g>

  <!-- the scan band, revealing the hidden instruction in amber -->
  <rect x="300" y="330" width="680" height="100" fill="#4d9be8" opacity="0.28"/>
  <rect x="390" y="362" width="420" height="20" fill="#e08a58"/>
  <rect x="390" y="396" width="260" height="16" fill="#e08a58" opacity="0.7"/>
  <g stroke="#ffffff" stroke-width="5" opacity="0.85">
    <line x1="300" y1="330" x2="980" y2="330"/>
    <line x1="300" y1="430" x2="980" y2="430"/>
  </g>
</svg>
