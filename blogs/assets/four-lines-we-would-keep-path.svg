<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>

  <!-- outcome: shown -->
  <text x="845" y="44" text-anchor="middle" fill="#0a1628" font-size="15" font-weight="600">shown to the visitor</text>

  <!-- verbatim path: match goes straight to the visitor -->
  <line x1="352" y1="135" x2="352" y2="40" stroke="#5b6b7c" stroke-width="2"/>
  <line x1="352" y1="40" x2="740" y2="40" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="368" y="28" fill="#5b6b7c" font-size="14">a match: our words, served verbatim, in milliseconds</text>

  <!-- question -->
  <rect x="20" y="135" width="170" height="80" rx="6" fill="#0b4f88"/>
  <text x="105" y="170" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">A visitor asks</text>
  <text x="105" y="194" text-anchor="middle" fill="#ffffff" font-size="15" opacity="0.85">a question</text>

  <line x1="190" y1="175" x2="248" y2="175" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- match -->
  <rect x="252" y="135" width="200" height="80" rx="6" fill="none" stroke="#0b4f88" stroke-width="2"/>
  <text x="352" y="168" text-anchor="middle" fill="#0a1628" font-size="17" font-weight="600">Matched against</text>
  <text x="352" y="192" text-anchor="middle" fill="#0a1628" font-size="17" font-weight="600">answers we wrote</text>

  <!-- model -->
  <line x1="452" y1="175" x2="516" y2="175" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="484" y="162" text-anchor="middle" fill="#5b6b7c" font-size="14">no match</text>
  <rect x="520" y="135" width="184" height="80" rx="6" fill="none" stroke="#0b4f88" stroke-width="2"/>
  <text x="612" y="168" text-anchor="middle" fill="#0a1628" font-size="17" font-weight="600">Model composes,</text>
  <text x="612" y="192" text-anchor="middle" fill="#0a1628" font-size="17" font-weight="600">from our pages only</text>

  <!-- the check -->
  <line x1="704" y1="175" x2="759" y2="175" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="763" y="135" width="164" height="80" rx="6" fill="none" stroke="#c4683c" stroke-width="3"/>
  <text x="845" y="168" text-anchor="middle" fill="#0a1628" font-size="17" font-weight="700">The check</text>
  <text x="845" y="192" text-anchor="middle" fill="#0a1628" font-size="15">four lines of code</text>

  <!-- clean answers go up to the visitor -->
  <line x1="845" y1="135" x2="845" y2="58" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- reciting answers are discarded -->
  <line x1="845" y1="215" x2="845" y2="254" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="824" y="280" text-anchor="middle" fill="#0a1628" font-size="15" font-weight="600">recites its own plumbing:</text>
  <text x="824" y="302" text-anchor="middle" fill="#0a1628" font-size="15" font-weight="600">discarded, a plain decline instead</text>
</svg>
