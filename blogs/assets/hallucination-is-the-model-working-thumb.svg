<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f88"/>
      <stop offset="0.55" stop-color="#0a3c68"/>
      <stop offset="1" stop-color="#082b4c"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd9f4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1140" cy="110" r="300" fill="#4d9be8" opacity="0.24"/>
  <circle cx="110" cy="640" r="240" fill="#c4683c" opacity="0.20"/>

  <!-- scattered sampling on the left: the randomness the model runs on -->
  <g fill="#ffffff">
    <circle cx="128" cy="176" r="11" opacity="0.55"/>
    <circle cx="212" cy="128" r="7" opacity="0.35"/>
    <circle cx="176" cy="268" r="14" opacity="0.62"/>
    <circle cx="272" cy="212" r="9" opacity="0.42"/>
    <circle cx="118" cy="352" r="8" opacity="0.38"/>
    <circle cx="244" cy="356" r="13" opacity="0.58"/>
    <circle cx="164" cy="448" r="10" opacity="0.45"/>
    <circle cx="284" cy="484" r="7" opacity="0.32"/>
    <circle cx="120" cy="548" r="12" opacity="0.5"/>
    <circle cx="228" cy="586" r="8" opacity="0.36"/>
    <circle cx="330" cy="298" r="7" opacity="0.3"/>
    <circle cx="344" cy="430" r="10" opacity="0.4"/>
    <circle cx="196" cy="358" r="6" opacity="0.28"/>
  </g>

  <!-- funnelling into one call -->
  <g stroke="#bcd9f4" stroke-width="4" opacity="0.55" fill="none">
    <path d="M176 268 C 340 300, 400 330, 470 358"/>
    <path d="M244 356 C 360 358, 410 358, 470 358"/>
    <path d="M164 448 C 330 420, 400 386, 470 358"/>
  </g>

  <!-- the inference call: one step, amber -->
  <rect x="470" y="288" width="150" height="146" fill="none" stroke="#e08a58" stroke-width="9"/>

  <!-- the checks: the gate every answer passes through -->
  <g stroke="#ffffff" stroke-width="9" opacity="0.9">
    <line x1="742" y1="238" x2="742" y2="484"/>
  </g>
  <g stroke="#ffffff" stroke-width="7" opacity="0.45">
    <line x1="784" y1="266" x2="784" y2="456"/>
    <line x1="820" y1="292" x2="820" y2="430"/>
  </g>

  <!-- one determinate line out the other side -->
  <rect x="620" y="348" width="122" height="20" rx="10" fill="url(#beam)" opacity="0.8"/>
  <rect x="840" y="348" width="290" height="20" rx="10" fill="url(#beam)"/>
  <path d="M1130 328 L 1176 358 L 1130 388 Z" fill="#ffffff"/>
</svg>
